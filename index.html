<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Frontend Mentor | QR Code Component - Tailwind</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-[#d5e1ef] flex flex-col items-center justify-center min-h-screen"
  >
    <main
      class="flex flex-col items-center w-[320px] min-h-[499px] gap-6 bg-white p-4 pb-10 rounded-[20px] md:w-[320px] md:max-w-[90%] shadow-md"
      >
      <img
        class="w-[288px] h-[288px] rounded-[10px]"
        src="./images/image-qr-code.png"
        alt="QR Code"
      />
      <div class="text-center p-4 pt-0 h-[131px]">
        <h1 class="text-[#1f314f] text-[22px] font-bold mb-4 mt-0">
          Improve your front-end skills by building projects
        </h1>
        <p class="text-[#7d889e] text-[15px] font-normal mb-4 leading-relaxed">
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
    </main>
    <footer class="text-[0.6875rem] text-center p-[30px]">
      Challenge by
      <a
        class="focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1f314f] focus-visible:outline-offset-2"
        href="https://www.frontendmentor.io?ref=challenge"
        >Frontend Mentor</a
      >. Coded by
      <a
        class="focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1f314f] focus-visible:outline-offset-2"
        href="#"
        >Mamadou Moussa Balde</a
      >.
    </footer>
  </body>
</html>
